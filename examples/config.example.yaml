version: "1"
defaultScope: single-repo

workflowAuthority:
  provider: gentle-ai
  implementationRouting: provider-policy
  sddActivation: explicit-or-accepted-proposal
  review: receipt-driven-development
  capabilityNegotiation: true

tooling:
  codeExploration: codegraph
  memory: engram
  codeSimplicity: ponytail
  communication: caveman
  communicationMode: adaptive

workTracking:
  provider: linear
  whenIssueLinked: true
  readHierarchy: true
  readRelated: true
  progressComments: meaningful-transitions
  commentLanguage: es
  closeWhenVerified: true

models:
  - id: trusted-primary-placeholder
    trust: trusted
    allowArbitraryShell: true
    allowedCapabilities:
      - repository-read
      - repository-write
      - approved-shell
      - closed-data-tools

mcpRouting:
  - capability: code-structure
    server: codegraph
    expectedState: enabled
  - capability: public-library-docs
    server: context7
    expectedState: enabled
  - capability: persistent-memory
    server: engram
    expectedState: enabled
  - capability: task-tracking
    server: linear
    expectedState: enabled
  - capability: internal-shared-library-docs
    server: mcp-raia-lib
    expectedState: disabled
  - capability: test-platform
    server: alegra-test
    expectedState: discover

confirmations:
  branchCreation: always
  productionMutation: always
  dynamodbWrite: exact-operation
  mongodbWrite: always
