version: "1"
platform: ubuntu-24.04

profiles:
  core:
    description: Herramientas base para cualquier proyecto
    mcps: ["codegraph", "engram"]
    tools: ["opencode", "gentle-ai", "engram", "codegraph", "rtk", "dh"]
    plugins: ["ponytail"]
  alegra:
    description: Trabajo cotidiano en Alegra
    mcps: ["codegraph", "engram", "linear", "context7", "wiki-alegra", "github"]
    tools: ["opencode", "gentle-ai", "engram", "codegraph", "rtk", "dh", "gh", "aws"]
    optional_packages: ["unzip"]
    plugins: ["ponytail"]
  migration:
    description: Migración monolito → microservicios
    extends: alegra
    mcps: ["navi"]
    tools: ["docker"]
    optional_packages: ["mariadb-client", "unzip"]
    plugins: ["ponytail"]
  full:
    description: Todos los MCPs y herramientas
    extends: alegra
    mcps: ["navi", "sentry"]
    tools: ["docker"]
    optional_packages: ["mariadb-client", "unzip"]
    plugins: ["ponytail"]

system_packages:
  required:
    - git
    - curl
    - jq
    - python3
    - python3-pip
    - python3-yaml
    - python3-jsonschema
    - python3-venv
    - ca-certificates
    - gnupg
  optional:
    - mariadb-client
    - unzip

user_tools:
  nvm:
    type: version
    version: "0.40.4"
    check: '[ -s "$NVM_DIR/nvm.sh" ]'
    install: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
  node:
    type: version
    version: "24"
    check: '. "$NVM_DIR/nvm.sh" && node --version 2>/dev/null | head -1 | grep -q "^v24"'
    install: . "$NVM_DIR/nvm.sh" && nvm install 24 && nvm alias default 24
    depends: nvm
  opencode:
    type: binary
    check: command -v opencode
    install: curl -fsSL https://opencode.ai/install | bash
  gentle-ai:
    type: binary
    check: command -v gentle-ai
    install: curl -fsSL https://gentle-ai.dev/install.sh | sh
  engram:
    type: binary
    check: command -v engram
    install: curl -fsSL https://engram.sh/install.sh | sh
  codegraph:
    type: binary
    check: command -v codegraph
    # ponytail: pinned to matching cli version, bump when tooling updates
    install: npm install -g @codegraph/cli@1.2.0
    depends: node
  rtk:
    type: binary
    check: command -v rtk
    install: curl -fsSL https://rtk.dev/install.sh | sh
  gh:
    type: system_package
    package: gh
  aws:
    type: binary
    check: command -v aws
    version: "2.36.15"
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.15.zip"
    sha256: "02a8eb2fe985be8ebcc284aaa5bae206ee8668872d6369e66a5c7d49d8671a08"
    depends: unzip
  dh:
    type: binary
    check: command -v dh
    install: 'eval "$(command -v bash)" && "$(dirname "$(readlink -f "$(command -v opencode || echo /dev/null)")")/../harness/scripts/install.sh" || echo "dh se instala con dh install o bootstrap"'
    note: "Se instala como symlink desde bin/dh del harness mediante install.sh"
  docker:
    type: skip_by_default
    check: command -v docker
    install: curl -fsSL https://get.docker.com | sh

mcp_servers:
  codegraph:
    command: codegraph serve --mcp
    type: local
  engram:
    command: engram mcp --tools=agent
    type: local
  context7:
    type: remote
    url: https://mcp.context7.com/mcp
  github:
    type: remote
    url: https://api.githubcopilot.com/mcp/
    oauth_required: false
    headers:
      Authorization: "Bearer {env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      X-MCP-Toolsets: "repos,pull_requests,issues"
  linear:
    type: remote
    url: https://mcp.linear.app/mcp
    oauth_required: true
  sentry:
    type: remote
    url: https://mcp.sentry.dev/mcp
    oauth_required: true
  wiki-alegra:
    type: remote
    url: https://wiki.alegra.com/mcp
    oauth_required: true
  navi:
    type: remote
    url: "{env:NAVI_MCP_URL}"
    oauth_required: true
    headers: {}
    oauth:
      clientId: "{env:NAVI_OAUTH_CLIENT_ID}"
      scope: "openid email profile"
      redirectUri: "http://localhost:8080/callback"

incompatible:
  alegra-test: "Solo funciona en Claude Code y ChatGPT; no en OpenCode"

plugins:
  ponytail:
    package: "@dietrichgebert/ponytail@4.8.4"
