name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: ShellCheck scripts
        run: |
          shellcheck -e SC1091,SC2154,SC2317 bin/dh scripts/*.sh

      - name: Bash syntax check
        run: |
          bash -n bin/dh scripts/*.sh

      - name: Validate config schema
        run: python3 tests/config-schema.test.py

      - name: Validate connections schema
        run: python3 tests/connections-schema.test.py

      - name: Validate example files against schemas
        run: python3 tests/examples-schema.test.py

      - name: Validate harness structure (Python)
        run: python3 tests/harness.test.py

      - name: Validate skill frontmatter
        run: |
          for skill in skills/*/SKILL.md; do
            [ -f "$skill" ] || continue
            head -1 "$skill" | grep -q '^---$' || { echo "FAIL: $skill missing frontmatter"; exit 1; }
            grep -q '^name: ' "$skill" || { echo "FAIL: $skill missing name"; exit 1; }
            grep -q '^description: ' "$skill" || { echo "FAIL: $skill missing description"; exit 1; }
            echo "  [ok] $skill"
          done

      - name: Install test
        run: bash tests/install.test.sh

      - name: Doctor test
        run: bash tests/doctor.test.sh

      - name: Bootstrap test
        run: bash tests/bootstrap.test.sh

      - name: Redact config test
        run: bash tests/redact-opencode-config.test.sh

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
