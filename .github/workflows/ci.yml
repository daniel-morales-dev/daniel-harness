name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash -s -- "bun-v1.3.14"
        env:
          BUN_INSTALL: "${{ runner.temp }}/bun"

      - name: TS typecheck + tool tests
        run: |
          export PATH="${{ runner.temp }}/bun/bin:$PATH"
          bun install --frozen-lockfile
          bun run typecheck
          bun run test:tools

      - name: ShellCheck scripts
        run: shellcheck -e SC1091,SC2015,SC2016,SC2154,SC2317 bin/dh scripts/*.sh

      - name: Bash syntax check
        run: bash -n bin/dh scripts/*.sh

      - name: Internal schemas
        run: python3 tests/test_config_schema.py && python3 tests/test_connections_schema.py && python3 tests/test_examples_schema.py

      - name: Profile resolver
        run: bash tests/profile-resolver.test.sh

      - name: Pytest
        run: python3 -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Config security
        run: python3 tests/test_security_config.py

      - name: Credential security
        run: python3 tests/test_security_credentials.py

      - name: Agents and skills
        run: python3 tests/test_harness.py

      - name: Validate skill frontmatter
        run: |
          for skill in skills/*/SKILL.md; do
            [ -f "$skill" ] || continue
            head -1 "$skill" | grep -q '^---$' || { echo "FAIL: $skill missing frontmatter"; exit 1; }
            grep -q '^name: ' "$skill" || { echo "FAIL: $skill missing name"; exit 1; }
            grep -q '^description: ' "$skill" || { echo "FAIL: $skill missing description"; exit 1; }
            name=$(grep '^name: ' "$skill" | sed 's/^name:[[:space:]]*//')
            dir=$(basename "$(dirname "$skill")")
            [ "$name" = "$dir" ] || { echo "FAIL: $skill name '$name' != directory '$dir'"; exit 1; }
            echo "  [ok] $skill"
          done

      - name: Install test
        run: bash tests/install.test.sh

      - name: Install/uninstall symmetry test
        run: bash tests/install-symmetry.test.sh

      - name: Doctor test
        run: bash tests/doctor.test.sh

      - name: Bootstrap test
        run: bash tests/bootstrap.test.sh

      - name: Dry-run test
        run: bash tests/dry-run.test.sh

      - name: Release smoke test (stubs)
        run: bash tests/release-smoke.test.sh --stubs

      - name: Redact config test
        run: bash tests/redact-opencode-config.test.sh

      - name: Clean runtime test
        run: bash tests/clean-runtime.test.sh

      - name: Data tools — MySQL
        run: python3 tests/test_data_mysql.py

      - name: Data tools — MongoDB
        run: python3 tests/test_data_mongodb.py

      - name: Data tools — DynamoDB read
        run: python3 tests/test_data_dynamodb_read.py

      - name: Data tools — DynamoDB write
        run: python3 tests/test_data_dynamodb_write.py

      - name: Data tools — Object storage
        run: python3 tests/test_data_object_storage.py

      - name: Data tools — Contract
        run: python3 tests/test_data_tools_contract.py

      - name: Data tools — Launcher
        run: bash tests/launcher.test.sh

      - name: Data tools — E2E
        run: bash tests/data-e2e.test.sh

      - name: Fail-closed validation
        run: bash tests/fail-closed.test.sh

      - name: First-run transactional
        run: bash tests/first-run-transaction.test.sh

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: E2E bootstrap
        run: bash tests/e2e-bootstrap.test.sh
      - name: MCP reconciliation
        run: bash tests/mcp-reconciliation.test.sh
      - name: OpenCode schema
        run: python3 tests/test_opencode_schema.py
      - name: Installer first-run
        run: bash tests/installer-first-run.test.sh
      - name: Doctor MCP status
        run: bash tests/doctor-mcp-status.test.sh
      - name: Plugin reconciliation
        run: bash tests/plugin-reconciliation.test.sh
      - name: Preflight output
        run: python3 tests/test_preflight.py
      - name: Drift 3-run persistence
        run: bash tests/drift-three-run.test.sh
      - name: Transaction failures
        run: bash tests/transaction-failures.test.sh

  gitleaks:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
