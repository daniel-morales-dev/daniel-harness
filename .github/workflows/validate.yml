name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: bash -n syntax
        run: |
          for s in bin/dh scripts/*.sh install; do
            [ -f "$s" ] && bash -n "$s" && echo "  [ok] $s"
          done
      - name: ShellCheck
        run: |
          sudo apt-get install -y -qq shellcheck
          for s in bin/dh scripts/*.sh install; do
            [ -f "$s" ] && shellcheck -e SC1091,SC2015,SC2016,SC2154,SC2317 "$s" && echo "  [ok] $s"
          done
      - name: Internal schemas
        run: python3 tests/config-schema.test.py && python3 tests/connections-schema.test.py && python3 tests/examples-schema.test.py
      - name: Profile resolver
        run: bash tests/profile-resolver.test.sh
      - name: Config security
        run: python3 tests/security-config.test.py
      - name: Agents and skills
        run: python3 tests/harness.test.py
